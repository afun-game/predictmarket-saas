name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go, integration, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -mod=vendor
      DATABASE_URL: postgres://predictmarket:password@localhost:5432/predictmarket?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      NATS_URL: nats://localhost:4222
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: predictmarket
          POSTGRES_PASSWORD: password
          POSTGRES_DB: predictmarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predictmarket -d predictmarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start NATS JetStream
        run: |
          docker run --detach --rm --name predictmarket-ci-nats \
            --publish 4222:4222 --publish 8222:8222 \
            nats:2.11-alpine -js -sd /data -m 8222
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8222/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs predictmarket-ci-nats
          exit 1

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Apply versioned database schema
        run: make db-migrate

      - name: Check formatting
        run: test -z "$(gofmt -l $(find cmd internal pkg tests -name '*.go' -type f))"

      - name: Build and vet
        run: |
          go build -buildvcs=false ./...
          go vet ./...

      - name: Run race tests
        run: go test -race -count=1 ./...

      - name: Run integration tests
        run: make test-integration-ci

      - name: Run HTTP end-to-end test
        run: make test-e2e-ci

      - name: Show NATS logs on failure
        if: failure()
        run: docker logs predictmarket-ci-nats

  deploy-dev:
    name: Deploy development environment
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: predictmarket-dev-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-east-1
      EKS_CLUSTER: mpg
      K8S_NAMESPACE: predictmarket-dev
      ECR_REPOSITORY: predictmarket-saas-dev
      DB_HOST: predictmarket-dev-postgres.c5a0y6ayuhqy.ap-east-1.rds.amazonaws.com
      DB_NAME: predictmarket
      RDS_SECRET_ID: arn:aws:secretsmanager:ap-east-1:042831095537:secret:predictmarket/dev/database-QpkGAP
      APPLICATION_SECRET_ID: predictmarket/dev/application

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::042831095537:role/predictmarket-dev-github-actions
          role-session-name: predictmarket-dev-deploy

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push application image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          TASK_IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:sha-$GITHUB_SHA"
          docker build --pull --tag "$TASK_IMAGE_URI" .
          docker push "$TASK_IMAGE_URI"
          echo "uri=$TASK_IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0

      - name: Configure cluster access
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Synchronize development secret from AWS Secrets Manager
        run: |
          set -euo pipefail
          kubectl get namespace "$K8S_NAMESPACE" >/dev/null

          TASK_DATABASE_URL="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$RDS_SECRET_ID" \
            --query SecretString \
            --output text | python3 -c 'import json, sys; from urllib.parse import quote; credentials = json.load(sys.stdin); print("postgres://{}:{}@{}:5432/{}?sslmode=require".format(quote(credentials["username"], safe=""), quote(credentials["password"], safe=""), sys.argv[1], quote(sys.argv[2], safe="")))' "$DB_HOST" "$DB_NAME")"
          TASK_ADMIN_API_KEY="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$APPLICATION_SECRET_ID" \
            --query SecretString \
            --output text | jq -er '.admin_api_key')"

          SECRET_ARGS=(
            --from-literal=DATABASE_URL="$TASK_DATABASE_URL"
            --from-literal=REDIS_URL='redis://predictmarket-redis:6379/0'
            --from-literal=NATS_URL='nats://predictmarket-nats:4222'
            --from-literal=ADMIN_API_KEY="$TASK_ADMIN_API_KEY"
          )

          # Admin console bootstrap credentials (optional; without them the
          # console stays disabled).
          TASK_ADMIN_USERNAME="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$APPLICATION_SECRET_ID" \
            --query SecretString \
            --output text | jq -er '.admin_username // empty' 2>/dev/null || true)"
          TASK_ADMIN_PASSWORD="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$APPLICATION_SECRET_ID" \
            --query SecretString \
            --output text | jq -er '.admin_password // empty' 2>/dev/null || true)"
          if [ -n "$TASK_ADMIN_USERNAME" ] && [ -n "$TASK_ADMIN_PASSWORD" ]; then
            SECRET_ARGS+=(--from-literal=ADMIN_USERNAME="$TASK_ADMIN_USERNAME")
            SECRET_ARGS+=(--from-literal=ADMIN_PASSWORD="$TASK_ADMIN_PASSWORD")
          else
            echo "::warning::predictmarket/dev/application is missing admin_username/admin_password; the admin console stays disabled"
          fi

          # V3 hosted routes are enabled only when all three values are
          # present; warn instead of failing so the deployment still proceeds.
          TASK_MERCHANT_SECRET_ENCRYPTION_KEY="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$APPLICATION_SECRET_ID" \
            --query SecretString \
            --output text | jq -er '.merchant_secret_encryption_key // empty' 2>/dev/null || true)"
          TASK_SESSION_JWT_SECRET="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$APPLICATION_SECRET_ID" \
            --query SecretString \
            --output text | jq -er '.session_jwt_secret // empty' 2>/dev/null || true)"
          TASK_HOSTED_UI_URL="$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$APPLICATION_SECRET_ID" \
            --query SecretString \
            --output text | jq -er '.hosted_ui_url // empty' 2>/dev/null || true)"
          if [ -n "$TASK_MERCHANT_SECRET_ENCRYPTION_KEY" ]; then
            SECRET_ARGS+=(--from-literal=MERCHANT_SECRET_ENCRYPTION_KEY="$TASK_MERCHANT_SECRET_ENCRYPTION_KEY")
          else
            echo "::warning::predictmarket/dev/application is missing merchant_secret_encryption_key; V3 routes stay disabled"
          fi
          if [ -n "$TASK_SESSION_JWT_SECRET" ]; then
            SECRET_ARGS+=(--from-literal=SESSION_JWT_SECRET="$TASK_SESSION_JWT_SECRET")
          else
            echo "::warning::predictmarket/dev/application is missing session_jwt_secret; V3 routes stay disabled"
          fi
          if [ -n "$TASK_HOSTED_UI_URL" ]; then
            SECRET_ARGS+=(--from-literal=HOSTED_UI_URL="$TASK_HOSTED_UI_URL")
          else
            echo "::warning::predictmarket/dev/application is missing hosted_ui_url; V3 routes stay disabled"
          fi

          kubectl -n "$K8S_NAMESPACE" create secret generic predictmarket-secrets \
            "${SECRET_ARGS[@]}" \
            --dry-run=client --output=yaml | kubectl apply -f -

      - name: Deploy Redis and NATS dependencies
        run: |
          set -euo pipefail
          kubectl -n "$K8S_NAMESPACE" apply -f k8s/overlays/dev/configmap.yaml
          kubectl -n "$K8S_NAMESPACE" apply -f k8s/overlays/dev/redis.yaml
          kubectl -n "$K8S_NAMESPACE" apply -f k8s/overlays/dev/nats.yaml
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/predictmarket-redis --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/predictmarket-nats --timeout=180s

      - name: Run migrations and deploy API
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          kubectl -n "$K8S_NAMESPACE" delete job predictmarket-migrate --ignore-not-found
          kubectl kustomize k8s/overlays/dev \
            | sed "s|IMAGE_URI|$IMAGE_URI|g" \
            | kubectl -n "$K8S_NAMESPACE" apply -f -
          kubectl -n "$K8S_NAMESPACE" wait --for=condition=complete \
            job/predictmarket-migrate --timeout=300s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/predictmarket-api --timeout=300s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/predictmarket-sports-ingest --timeout=300s
          kubectl -n "$K8S_NAMESPACE" get deployment,pods

      - name: Show workload logs on failure
        if: failure()
        run: |
          kubectl -n "$K8S_NAMESPACE" get pods,events --sort-by=.lastTimestamp || true
          kubectl -n "$K8S_NAMESPACE" logs job/predictmarket-migrate --all-containers=true || true
          kubectl -n "$K8S_NAMESPACE" logs deployment/predictmarket-api --tail=100 || true
          kubectl -n "$K8S_NAMESPACE" logs deployment/predictmarket-sports-ingest --tail=100 || true
