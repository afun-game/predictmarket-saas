apiVersion: batch/v1
kind: Job
metadata:
  name: predictmarket-migrate
  namespace: predictmarket
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: ghcr.io/your-org/predictmarket-saas:0.1.0
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: predictmarket-secrets
                  key: DATABASE_URL
          command: ["/app/predictmarket-migrate", "up"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
