apiVersion: v1
kind: Secret
metadata:
  name: predictmarket-secrets
  namespace: predictmarket
type: Opaque
stringData:
  DATABASE_URL: postgres://USER:PASSWORD@POSTGRES_HOST:5432/predictmarket?sslmode=require
  REDIS_URL: redis://:PASSWORD@REDIS_HOST:6379/0
  NATS_URL: nats://USER:PASSWORD@NATS_HOST:4222
  ADMIN_API_KEY: replace-with-at-least-32-random-bytes
  # All three values are required together before V3 hosted-session routes start.
  # Generate the first two as base64url-encoded random 32-byte values.
  MERCHANT_SECRET_ENCRYPTION_KEY: replace-with-base64url-32-byte-key
  SESSION_JWT_SECRET: replace-with-base64url-32-byte-key
  HOSTED_UI_URL: https://play.predictmarket.example/launch
