apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictmarket-nats
  labels:
    app.kubernetes.io/name: predictmarket-nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: predictmarket-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: predictmarket-nats
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nats
          image: nats:2.11-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: jetstream-data
              mountPath: /data
      volumes:
        - name: jetstream-data
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: predictmarket-nats
spec:
  selector:
    app.kubernetes.io/name: predictmarket-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
