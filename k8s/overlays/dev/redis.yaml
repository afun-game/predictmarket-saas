apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictmarket-redis
  labels:
    app.kubernetes.io/name: predictmarket-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: predictmarket-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: predictmarket-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: predictmarket-redis
spec:
  selector:
    app.kubernetes.io/name: predictmarket-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
