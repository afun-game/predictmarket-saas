apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictmarket-api
  namespace: predictmarket
  labels:
    app.kubernetes.io/name: predictmarket-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: predictmarket-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: predictmarket-api
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/your-org/predictmarket-saas:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: predictmarket-config
            - secretRef:
                name: predictmarket-secrets
          env:
            - name: SERVICETWILL_CONFIG
              value: /etc/predictmarket/twill.toml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: twill-config
              mountPath: /etc/predictmarket
              readOnly: true
            - name: runtime-data
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: twill-config
          configMap:
            name: predictmarket-config
            items:
              - key: twill.toml
                path: twill.toml
        - name: runtime-data
          emptyDir:
            sizeLimit: 64Mi
