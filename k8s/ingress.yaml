apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: predictmarket-api
  namespace: predictmarket
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.predictmarket.example.com]
      secretName: predictmarket-tls
  rules:
    - host: api.predictmarket.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: predictmarket-api
                port:
                  name: http
