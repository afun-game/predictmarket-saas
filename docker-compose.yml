services:
  postgres:
    image: postgres:15-alpine
    container_name: predictmarket-postgres
    environment:
      POSTGRES_USER: predictmarket
      POSTGRES_PASSWORD: password
      POSTGRES_DB: predictmarket
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictmarket -d predictmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-sandbox:
    image: postgres:15-alpine
    container_name: predictmarket-postgres-sandbox
    profiles: ["sandbox"]
    environment:
      POSTGRES_USER: predictmarket
      POSTGRES_PASSWORD: password
      POSTGRES_DB: predictmarket_sandbox
    ports:
      - "55432:5432"
    volumes:
      - postgres_sandbox_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictmarket -d predictmarket_sandbox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: predictmarket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:latest
    container_name: predictmarket-nats
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "/nats-server", "--signal", "reopen=1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  postgres_sandbox_data:
  redis_data:
  nats_data:
